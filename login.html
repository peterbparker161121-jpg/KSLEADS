<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — KS Leads</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body style="align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; background-color: #050811;">
  <div class="card" style="max-width: 440px; width: 100%; padding: 2.5rem 2rem; border-color: var(--border-subtle); box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
        KS <span>LEADS</span>
      </a>
      <h2 style="font-size: 1.5rem; color: #fff;">Acesse sua Conta</h2>
      <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">
        Insira suas credenciais para gerenciar suas prospecções.
      </p>
    </div>

    <form id="form-login">
      <div class="form-group">
        <label class="form-label" for="login-email">Seu E-mail</label>
        <input type="email" id="login-email" class="form-input" placeholder="exemplo@empresa.com.br" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label" for="login-password">Sua Senha</label>
          <a href="/recuperar-senha.html" style="font-size: 0.8rem; color: var(--accent);">Esqueceu a senha?</a>
        </div>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
        Entrar na Plataforma
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
      Ainda não tem acesso? <a href="/cadastro.html" style="color: var(--accent); font-weight: 600;">Criar uma conta</a>
    </div>
  </div>

  <script type="module">
    import { Utils } from '/assets/js/utils.js';
    import { Auth, getSupabase } from '/assets/js/supabase-client.js';

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-submit-login');

      btn.disabled = true;
      btn.textContent = 'Autenticando...';

      try {
        const data = await Auth.signIn(email, password);
        Utils.showToast('Login realizado com sucesso!', 'success');

        const profile = await Auth.getProfile();
        // Redirecionamento condicional por papel
        if (profile && profile.role === 'admin') {
          window.location.href = '/admin/';
        } else {
          const redirect = sessionStorage.getItem('redirect_after_login') || '/app/';
          sessionStorage.removeItem('redirect_after_login');
          window.location.href = redirect;
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Entrar na Plataforma';
        Utils.showToast(err.message || 'Falha ao autenticar. Verifique e-mail e senha.', 'error');
      }
    });
  </script>
  <script src="/assets/js/cookie-consent.js"></script>
</body>
</html>
