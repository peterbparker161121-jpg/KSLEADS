<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — KS Leads</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body style="align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; background-color: #050811;">
  <div class="card" style="max-width: 460px; width: 100%; padding: 2.5rem 2rem; border-color: var(--border-subtle); box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 0.75rem;">
        KS <span>LEADS</span>
      </a>
      <h2 style="font-size: 1.5rem; color: #fff;">Crie sua Conta Gratuita</h2>
      <p style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">
        Inicie com créditos de cortesia para testar a busca de empresas.
      </p>
    </div>

    <form id="form-register">
      <div class="form-group">
        <label class="form-label" for="reg-name">Seu Nome Completo *</label>
        <input type="text" id="reg-name" class="form-input" placeholder="Ex: Peter Silva" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Seu E-mail Profissional *</label>
        <input type="email" id="reg-email" class="form-input" placeholder="contato@empresa.com.br" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-phone">WhatsApp para Contato</label>
        <input type="text" id="reg-phone" class="form-input" placeholder="(19) 99999-9999">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Crie uma Senha *</label>
        <input type="password" id="reg-password" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <div class="form-check" style="margin-bottom: 1.5rem;">
        <input type="checkbox" id="reg-terms" required>
        <span style="font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4;">
          Concordo com os <a href="/termos.html" target="_blank">Termos de Uso</a> e com a <a href="/privacidade.html" target="_blank">Política de Privacidade (LGPD)</a>.
        </span>
      </div>

      <button type="submit" id="btn-submit-reg" class="btn btn-primary" style="width: 100%;">
        Criar Minha Conta & Começar
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
      Já possui cadastro? <a href="/login.html" style="color: var(--accent); font-weight: 600;">Fazer Login</a>
    </div>
  </div>

  <script type="module">
    import { Utils } from '/assets/js/utils.js';
    import { Auth } from '/assets/js/supabase-client.js';

    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-submit-reg');

      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        await Auth.signUp(email, password, name, phone);
        Utils.showToast('Conta criada com sucesso! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = '/app/';
        }, 1200);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Criar Minha Conta & Começar';
        Utils.showToast(err.message || 'Erro ao realizar cadastro.', 'error');
      }
    });
  </script>
  <script src="/assets/js/cookie-consent.js"></script>
</body>
</html>
